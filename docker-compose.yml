services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: ekos-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - qdrant
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  neo4j:
    image: neo4j:5-community
    container_name: ekos-neo4j
    environment:
      NEO4J_AUTH: neo4j/change-me
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ekos-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    image: node:22-alpine
    container_name: ekos-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "echo 'Frontend placeholder. Add React app later.' && tail -f /dev/null"

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
